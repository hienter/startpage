<!-- 설정 모달 -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold text-black">내 센터 설정</h2>
            <button id="closeModal" class="text-gray-400 hover:text-black transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div class="space-y-2 mb-6">
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 hover:border-black transition-colors cursor-pointer service-option" data-service="visitCare">
                <input type="radio" name="serviceType" value="visitCare" class="mr-3 w-4 h-4 text-black" checked>
                <span class="text-black font-medium flex-1">방문요양</span>
            </label>
            
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 bg-gray-100 cursor-not-allowed opacity-50">
                <input type="radio" name="serviceType" value="visitBath" class="mr-3 w-4 h-4" disabled>
                <span class="text-gray-400 flex-1">
                    <span>방문목욕</span>
                    <span class="text-xs text-gray-400 ml-2">개발중</span>
                </span>
            </label>
            
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 bg-gray-100 cursor-not-allowed opacity-50">
                <input type="radio" name="serviceType" value="visitNurse" class="mr-3 w-4 h-4" disabled>
                <span class="text-gray-400 flex-1">
                    <span>방문간호</span>
                    <span class="text-xs text-gray-400 ml-2">개발중</span>
                </span>
            </label>
            
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 bg-gray-100 cursor-not-allowed opacity-50">
                <input type="radio" name="serviceType" value="dayCare" class="mr-3 w-4 h-4" disabled>
                <span class="text-gray-400 flex-1">
                    <span>주야간보호</span>
                    <span class="text-xs text-gray-400 ml-2">개발중</span>
                </span>
            </label>
            
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 bg-gray-100 cursor-not-allowed opacity-50">
                <input type="radio" name="serviceType" value="shortTerm" class="mr-3 w-4 h-4" disabled>
                <span class="text-gray-400 flex-1">
                    <span>단기보호</span>
                    <span class="text-xs text-gray-400 ml-2">개발중</span>
                </span>
            </label>
            
            <label class="flex items-center w-full px-4 py-3 rounded-lg border-2 border-gray-200 bg-gray-100 cursor-not-allowed opacity-50">
                <input type="radio" name="serviceType" value="welfare" class="mr-3 w-4 h-4" disabled>
                <span class="text-gray-400 flex-1">
                    <span>복지용구</span>
                    <span class="text-xs text-gray-400 ml-2">개발중</span>
                </span>
            </label>
        </div>
        
        <div class="flex justify-end space-x-3">
            <button id="cancelBtn" class="px-4 py-2 text-gray-600 hover:text-black transition-colors">
                취소
            </button>
            <button id="saveBtn" class="px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800 transition-colors">
                저장
            </button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 중복 초기화 방지
        if (window.modalInitialized) {
            return;
        }
        window.modalInitialized = true;
        
        // DOM이 완전히 로드된 후 실행
        function initModalHandlers() {
            const settingsModal = document.getElementById('settingsModal');
            const closeModal = document.getElementById('closeModal');
            const cancelBtn = document.getElementById('cancelBtn');
            const saveBtn = document.getElementById('saveBtn');
            
            if (!settingsModal || !closeModal || !cancelBtn || !saveBtn) {
                console.warn('Modal elements not found');
                return;
            }
            
            // 모달 닫기 함수
            function closeModalFunc(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                settingsModal.classList.add('hidden');
            }
            
            // 엑스 버튼 클릭 이벤트
            closeModal.onclick = function(e) {
                closeModalFunc(e);
            };
            
            // SVG 클릭도 버튼으로 전달되도록
            const closeModalSvg = closeModal.querySelector('svg');
            if (closeModalSvg) {
                closeModalSvg.style.pointerEvents = 'none';
            }
            
            // 취소 버튼 클릭 이벤트
            cancelBtn.onclick = function(e) {
                closeModalFunc(e);
            };
            
            // 저장 버튼 클릭 이벤트
            saveBtn.onclick = async function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const selectedService = document.querySelector('input[name="serviceType"]:checked');
                if (selectedService) {
                    // localStorage에 저장
                    localStorage.setItem('selectedService', selectedService.value);
                    
                    // 서버에 선택 통계 저장
                    try {
                        const formData = new FormData();
                        formData.append('service_type', selectedService.value);
                        
                        await fetch('/api/save-service-preference/', {
                            method: 'POST',
                            body: formData
                        });
                    } catch (error) {
                        console.error('서비스 선택 통계 저장 실패:', error);
                    }
                    
                    // 커스텀 이벤트 발생하여 선택된 서비스 표시 업데이트
                    window.dispatchEvent(new Event('serviceUpdated'));
                    
                    // 선택된 서비스 이름 가져오기
                    const serviceName = selectedService.closest('label')?.querySelector('span')?.textContent || '방문요양';
                    alert(`${serviceName}이(가) 저장되었습니다.`);
                    closeModalFunc();
                } else {
                    alert('급여 종류를 선택해주세요.');
                }
            };
            
            // 모달 배경 클릭 시 닫기
            settingsModal.onclick = function(e) {
                // 모달 배경(외부) 클릭 시에만 닫기
                if (e.target === settingsModal) {
                    closeModalFunc(e);
                }
            };
            
            // 모달 내부 클릭 시 이벤트 전파 방지 (배경 클릭으로 닫히지 않도록)
            const modalContent = settingsModal.querySelector('div > div');
            if (modalContent) {
                modalContent.onclick = function(e) {
                    // 버튼 클릭은 전파 허용 (버튼의 이벤트 리스너가 처리)
                    // 모달 내부의 다른 영역 클릭만 전파 방지
                    if (!e.target.closest('button')) {
                        e.stopPropagation();
                    }
                };
            }
        }
        
        // 라디오 버튼 스타일 업데이트 함수
        function updateRadioStyles() {
            const serviceOptions = document.querySelectorAll('.service-option');
            serviceOptions.forEach(option => {
                const label = option;
                const input = label.querySelector('input[type="radio"]');
                if (input && input.checked) {
                    label.classList.add('border-black');
                    label.classList.remove('border-gray-200');
                } else {
                    label.classList.remove('border-black');
                    label.classList.add('border-gray-200');
                }
            });
        }
        
        // localStorage에서 저장된 서비스 불러오기
        function loadSavedService() {
            let savedService = localStorage.getItem('selectedService');
            
            // 저장된 값이 없으면 기본값으로 방문요양 설정
            if (!savedService) {
                savedService = 'visitCare';
                localStorage.setItem('selectedService', savedService);
            }
            
            const radio = document.querySelector(`input[name="serviceType"][value="${savedService}"]`);
            if (radio) {
                radio.checked = true;
                updateRadioStyles();
            }
        }
        
        // 라디오 버튼 선택 시 스타일 업데이트
        function initRadioButtons() {
            const radioButtons = document.querySelectorAll('input[name="serviceType"]');
            radioButtons.forEach(radio => {
                radio.addEventListener('change', () => {
                    updateRadioStyles();
                });
            });
            updateRadioStyles();
        }
        
        // DOM이 로드되면 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                initModalHandlers();
                loadSavedService();
                initRadioButtons();
            });
        } else {
            // DOM이 이미 로드된 경우 즉시 실행
            initModalHandlers();
            loadSavedService();
            initRadioButtons();
        }
    })();
</script>
