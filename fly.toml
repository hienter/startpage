app = "startpage"
primary_region = "icn"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  SECRET_KEY = "change-me-in-render-dashboard"
  DEBUG = "False"
  ALLOWED_HOSTS = "startpage.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

